# Modified for the Stackpulse fork: publish only the symbol libraries.
[workspace]
resolver = "2"
members = ["samply-debugid", "samply-object", "samply-symbols", "samply-api", "wholesym"]
default-members = ["samply-debugid", "samply-object", "samply-symbols", "samply-api", "wholesym"]
exclude = ["etw-reader", "fxprof-processed-profile", "gecko_profile", "samply", "samply-quota-manager", "tools/benchmarks", "tools/dump_table", "tools/query_api", "wholesym-addr2line"]

[profile.dist]
inherits = "release"
lto = "thin"
