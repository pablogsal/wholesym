# Modified for the Stackpulse fork: package metadata and dependency aliases.
[package]
name = "samply-object-stackpulse"
version = "0.1.0"
authors = ["Markus Stange <mstange.moz@gmail.com>"]
license = "MIT OR Apache-2.0"
edition = "2021"
description = "Samply object functions. (Stackpulse fork)"
repository = "https://github.com/pablogsal/wholesym"
readme = "README.md"

[dependencies.debugid]
default-features = false
version = "0.8.0"

[dependencies.object]
default-features = false
features = ["read_core"]
version = "0.41"

[dependencies.uuid]
default-features = false
version = "1"

[dependencies]
samply-debugid = { package = "samply-debugid-stackpulse", version = "=0.1.0", path = "../samply-debugid" }
[lib]
name = "samply_object"
